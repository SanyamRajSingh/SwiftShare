# ===================================================================
# SwiftShare Audit Microservice - Application Configuration
# ===================================================================

server.port=8081

# Independent H2 Database persistence store (Decentralized Database pattern)
spring.datasource.url=jdbc:h2:file:./target/data/audit_swiftshare_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Application Name
spring.application.name=swiftshare-audit-service
