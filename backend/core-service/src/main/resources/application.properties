# ===================================================================
# SwiftShare Core Service - Application Configuration
# ===================================================================

server.port=8080

# Spring Data JPA & H2 Configuration (Lightweight persistent file-based store)
spring.datasource.url=jdbc:h2:file:./target/data/core_swiftshare_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Inter-Service Communication Target (Audit Microservice on Port 8081)
audit.service.url=http://localhost:8081/api/audit

# Application Name
spring.application.name=swiftshare-core-service
